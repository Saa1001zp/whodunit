name: test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # git is needed so the blame tests work
          git config --global user.email "ci@whodunit.local"
          git config --global user.name "ci"
          git config --global init.defaultBranch main

      - name: lint
        run: python -m ruff check app tests scripts || true

      - name: run tests
        run: pytest -v
